services:
  postgres:
    image: postgres:18
    container_name: smartscore-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - smartscore_postgres_data:/var/lib/postgresql

volumes:
  smartscore_postgres_data: